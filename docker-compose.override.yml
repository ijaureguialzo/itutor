services:
  web:
    ports:
      - "80:80"

  phpmyadmin:
    ports:
      - "8080:80"
    environment:
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-12345Abcde}

  mariadb:
    ports:
      - "127.0.0.1:3306:3306"

  tests:
    build: ./tests
    profiles: ["tools"]
    volumes:
      - ./app:/var/www:ro
    environment:
      - ITUTOR_URL=${ITUTOR_URL:-http://web}
      - MYSQL_HOST=${MYSQL_HOST:-bd}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-itutor}
      - MYSQL_USER=${MYSQL_USER:-itutor}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-12345Abcde}
      - APP_USER=${APP_USER:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-12345Abcde}
    depends_on:
      - web
    restart: "no"
