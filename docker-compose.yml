services:

  bd:
    image: mariadb:11
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-itutor}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-12345Abcde}
      - MYSQL_USER=${MYSQL_USER:-itutor}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-12345Abcde}
    volumes:
      - mariadb:/var/lib/mysql
      - ./config/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-12345Abcde}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./config
      dockerfile: Dockerfile.web
      args:
        - PHP_VERSION=${PHP_VERSION:-8.5}
    depends_on:
      bd:
        condition: service_healthy
    volumes:
      - ./app:/var/www
      - ./app/web:/var/www/html
      - ./app/lib/vendor/symfony/data/web/sf:/var/www/html/sf
      - symfony_cache:/var/www/cache
      - symfony_log:/var/www/log
    ports:
      - "80:80"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      - bd
    environment:
      - PMA_HOST=bd
      - PMA_PORT=3306
    ports:
      - "8080:80"
    restart: unless-stopped

  tests:
    build: ./tests
    profiles: ["tools"]
    volumes:
      - ./app:/var/www:ro
    environment:
      - ITUTOR_URL=${ITUTOR_URL:-http://web}
      - MYSQL_HOST=${MYSQL_HOST:-bd}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-itutor}
      - MYSQL_USER=${MYSQL_USER:-itutor}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-12345Abcde}
      - APP_USER=${APP_USER:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-12345Abcde}
    depends_on:
      - web
    restart: "no"

volumes:
  mariadb:
  symfony_cache:
  symfony_log:
